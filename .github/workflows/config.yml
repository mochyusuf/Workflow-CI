name: CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn numpy mlflow

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Save mlruns to Github
        run: |
          git config --global user.name ${{ secrets.USERNAME }}
          git config --global user.email ${{ secrets.EMAIL }}
          git add -f mlruns/
          git commit -m "Save mlruns" || true
          git push origin

      - name: Get Run ID
        id: get_run_id
        run: |
          RUN_ID=$(python -c "import mlflow; print(mlflow.search_runs(experiment_ids=['0']).iloc[0].run_id)")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"
          
      - name: Build Docker Image from MLflow Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "data_rumah_model"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag and Push Docker Image
        run: |
          docker tag data_rumah_model ${{ secrets.DOCKER_HUB_USERNAME }}/data_rumah:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/data_rumah:latest